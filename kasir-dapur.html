<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meow Caffe - Kasir dan Dapur</title>
<style>
  :root{--merah:#7A1426;--kertas:#FBF1DF;--emas:#C99A3B;--tinta:#3B1A1F}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Georgia,serif;background:#561020;color:var(--kertas);padding:16px;min-height:100vh}
  h1{font-size:22px;color:#EBCB7E;margin-bottom:12px}
  h2{font-size:16px;margin:18px 0 8px;color:#EBCB7E;font-weight:400;letter-spacing:.5px}
  .login{max-width:320px;margin:60px auto;text-align:center}
  input{width:100%;padding:12px;margin:6px 0;border-radius:4px;border:1px solid var(--emas);background:var(--kertas);font:16px Georgia,serif}
  button{cursor:pointer;font:15px Georgia,serif;border-radius:999px;padding:10px 16px;border:1px solid var(--emas)}
  .utama{background:var(--emas);color:var(--tinta);width:100%;margin-top:8px}
  .atas{display:flex;justify-content:space-between;align-items:center}
  .keluar{background:none;color:var(--kertas);padding:6px 12px}
  .grid{display:grid;gap:10px}
  @media(min-width:760px){.dua{display:grid;grid-template-columns:1fr 1fr;gap:20px}}
  .tiket{background:var(--kertas);color:var(--tinta);padding:12px 14px;border-radius:4px;border-left:8px solid #C0392B}
  .tiket.lunas{border-left-color:#2E7D32}
  .tiket.selesai{border-left-color:#8E8E8E}
  .tiket.dibatalkan{border-left-color:#C0392B;opacity:.7}
  .batal{color:#C0392B;font-weight:700}
  .ringkas{font-size:13px;color:#D9C2A0;margin:-2px 0 10px}
  .riwayat{margin-top:26px;padding-top:6px;border-top:1px solid rgba(201,154,59,.35)}
  @media(min-width:760px){#riwayatList{grid-template-columns:1fr 1fr}}
  .baris{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .kode{font-weight:700;font-size:18px}
  .menu{font-size:17px;margin:4px 0}
  .kecil{font-size:13px;color:#7A5A52}
  .aksi{display:flex;gap:8px;margin-top:10px}
  .aksi button{flex:1;background:transparent;color:var(--tinta)}
  .aksi .ok{background:#2E7D32;color:#fff;border-color:#2E7D32}
  .kosong{font-style:italic;color:#D9C2A0}
  #err{color:#FFB4B4;font-size:14px;min-height:18px}
</style>
</head>
<body>

<div class="login" id="login">
  <h1>Kasir dan Dapur</h1>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Kata sandi" autocomplete="current-password">
  <button class="utama" onclick="masuk()">Masuk</button>
  <p id="err"></p>
</div>

<div id="app" hidden>
  <div class="atas"><h1>Meow Caffe</h1><button class="keluar" onclick="keluar()">Keluar</button></div>
  <div class="dua">
    <div><h2>Menunggu bayar (kasir)</h2><div class="grid" id="kolBayar"></div></div>
    <div><h2>Masuk dapur (sudah lunas)</h2><div class="grid" id="kolDapur"></div></div>
  </div>
  <div class="riwayat">
    <h2>Riwayat pesanan (24 jam terakhir)</h2>
    <p class="ringkas" id="ringkas">Pesanan selesai dan dibatalkan tampil di sini, lalu hilang otomatis setelah 24 jam.</p>
    <div class="grid" id="riwayatList"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, query, where, orderBy, limit, onSnapshot, doc, updateDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

// Isi dengan config yang SAMA seperti di halaman menu
const firebaseConfig = {
  apiKey: "AIzaSyAoh5e5fpNfMHRpzH5qam0MIM1wjJa4QO8",
  authDomain: "caffee-38697.firebaseapp.com",
  projectId: "caffee-38697",
  storageBucket: "caffee-38697.firebasestorage.app",
  messagingSenderId: "465437187056",
  appId: "1:465437187056:web:71ca80ad491623ea411b35"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app), auth = getAuth(app);
let stop = null, awal = true, kenal = new Set(), hariPantau = '', terakhir = null;
const $ = id => document.getElementById(id);

window.masuk = async () => {
  $('err').innerText = '';
  try { await signInWithEmailAndPassword(auth, $('em').value.trim(), $('pw').value); }
  catch(e){
    const peta = {
      'auth/invalid-credential': 'Email atau kata sandi salah.',
      'auth/wrong-password': 'Email atau kata sandi salah.',
      'auth/user-not-found': 'Akun dengan email ini belum dibuat di Firebase.',
      'auth/invalid-email': 'Format email tidak valid.',
      'auth/operation-not-allowed': 'Login Email/Password belum diaktifkan di Firebase.',
      'auth/unauthorized-domain': 'Alamat web ini belum diizinkan di Firebase Authentication.',
      'auth/operation-not-supported-in-this-environment': 'Buka lewat alamat http/https, jangan dari file langsung.',
      'auth/network-request-failed': 'Tidak ada koneksi internet.',
      'auth/too-many-requests': 'Terlalu banyak percobaan, tunggu sebentar.'
    };
    console.error(e);
    $('err').innerText = (peta[e.code] || 'Gagal masuk.') + ' (' + e.code + ')';
  }
};
$('pw').addEventListener('keydown', e => { if(e.key === 'Enter') window.masuk(); });
window.keluar = () => signOut(auth);

// Pantau pesanan 24 jam terakhir (maksimal 200). Kolom kasir dan dapur hanya menampilkan pesanan hari ini,
// sedangkan riwayat menampilkan pesanan selesai dalam 24 jam terakhir.
function mulai(){
  if(stop){ stop(); stop = null; }
  const awalHari = new Date(); awalHari.setHours(0,0,0,0);
  hariPantau = awalHari.toDateString();
  const batas24 = new Date(Date.now() - 24*60*60*1000);
  awal = true; kenal = new Set();
  stop = onSnapshot(
    query(collection(db,'pesanan'), where('dibuat','>=',Timestamp.fromDate(batas24)), orderBy('dibuat','desc'), limit(200)),
    render,
    e => { console.error(e); alert('Gagal baca pesanan: ' + e.code); }
  );
}

onAuthStateChanged(auth, user => {
  $('login').hidden = !!user; $('app').hidden = !user;
  if(stop){ stop(); stop = null; }
  if(user) mulai();
});

// Kalau halaman dibiarkan terbuka sampai ganti hari, mulai ulang pantauan
setInterval(() => { if(auth.currentUser && new Date().toDateString() !== hariPantau) mulai(); }, 5 * 60 * 1000);

let ctx = null;
const buka = () => {
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state === 'suspended') ctx.resume();
  }catch(e){}
};
document.addEventListener('click', buka);
document.addEventListener('touchstart', buka);

function bunyi(){
  try{
    buka();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = .3;
    o.start(); o.stop(ctx.currentTime + .4);
  }catch(e){}
}
// Saat selesai/dibatalkan, isi hapusPada (dibuat + 24 jam) supaya TTL Firestore menghapusnya otomatis
async function ubah(id, status, d){
  const data = { status };
  if((status === 'selesai' || status === 'dibatalkan') && d && d.dibuat && d.dibuat.seconds != null)
    data.hapusPada = new Timestamp(d.dibuat.seconds + 24*60*60, d.dibuat.nanoseconds);
  const ref = doc(db,'pesanan',id);
  try { await updateDoc(ref, data); }
  catch(e){
    if(e.code === 'permission-denied' && data.hapusPada){ try { await updateDoc(ref, { status }); return; } catch(e2){ e = e2; } }
    console.error(e); alert('Gagal mengubah status: ' + e.code);
  }
}

function tiket(d, id, tombol){
  const el = document.createElement('div');
  el.className = 'tiket ' + (d.status==='lunas' ? 'lunas' : d.status==='selesai' ? 'selesai' : d.status==='dibatalkan' ? 'dibatalkan' : '');
  const r = document.createElement('div'); r.className = 'baris';
  const k = document.createElement('span'); k.className = 'kode'; k.textContent = '#' + id.slice(0,4).toUpperCase();
  const t = document.createElement('span'); t.textContent = 'Rp ' + Number(d.total||0).toLocaleString('id-ID');
  r.append(k, t);
  const m = document.createElement('div'); m.className = 'menu';
  if(Array.isArray(d.items) && d.items.length){
    d.items.forEach(it => { const b = document.createElement('div'); b.textContent = (it.qty || 1) + '\u00d7 ' + it.nama; m.append(b); });
  } else { m.textContent = d.menu; }
  const jam = (d.dibuat && d.dibuat.toDate) ? d.dibuat.toDate().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) : '';
  const n = document.createElement('div'); n.className = 'kecil'; n.textContent = d.nama + ' | ' + d.lokasi + (jam ? ' | ' + jam : '');
  if(d.status === 'dibatalkan'){ const bt = document.createElement('b'); bt.className = 'batal'; bt.textContent = ' | DIBATALKAN'; n.append(bt); }
  const a = document.createElement('div'); a.className = 'aksi';
  tombol.forEach(([teks, fn, cls]) => { const b = document.createElement('button'); b.textContent = teks; if(cls) b.className = cls; b.onclick = fn; a.append(b); });
  el.append(r, m, n);
  if(tombol.length) el.append(a);
  return el;
}

function render(snap){
  if(snap) terakhir = snap;
  if(!terakhir) return;
  const bayar = $('kolBayar'), dapur = $('kolDapur'), riwayat = $('riwayatList');
  bayar.innerHTML = ''; dapur.innerHTML = ''; riwayat.innerHTML = '';
  const sekarang = Date.now(), batas = sekarang - 24*60*60*1000;
  const awalHariMs = new Date().setHours(0,0,0,0);
  let baru = false, jumlah = 0, omzet = 0, batal = 0;
  terakhir.forEach(s => {
    const d = s.data(), id = s.id;
    const waktu = (d.dibuat && d.dibuat.toMillis) ? d.dibuat.toMillis() : sekarang;
    if(snap && !kenal.has(id+d.status)){ kenal.add(id+d.status); if(!awal) baru = true; }
    if(d.status === 'selesai' || d.status === 'dibatalkan'){
      if(waktu >= batas){
        riwayat.append(tiket(d, id, []));
        if(d.status === 'selesai'){ jumlah++; omzet += Number(d.total||0); } else batal++;
      }
      return;
    }
    if(waktu < awalHariMs) return;   // kolom kasir dan dapur: pesanan hari ini saja
    if(d.status === 'menunggu_bayar')
      bayar.append(tiket(d, id, [['Batalkan', () => ubah(id,'dibatalkan', d)], ['Sudah dibayar', () => ubah(id,'lunas'), 'ok']]));
    else if(d.status === 'lunas')
      dapur.append(tiket(d, id, [['Selesai', () => ubah(id,'selesai', d), 'ok']]));
  });
  [bayar, dapur, riwayat].forEach(x => { if(!x.children.length){ const p = document.createElement('p'); p.className = 'kosong'; p.textContent = 'Belum ada pesanan.'; x.append(p); } });
  $('ringkas').textContent = (jumlah || batal)
    ? jumlah + ' selesai (Rp ' + omzet.toLocaleString('id-ID') + ') | ' + batal + ' dibatalkan | hilang otomatis setelah 24 jam'
    : 'Pesanan selesai dan dibatalkan tampil di sini, lalu hilang otomatis setelah 24 jam.';
  if(baru) bunyi();
  awal = false;
}

// Segarkan tiap menit supaya pesanan yang sudah lewat 24 jam hilang sendiri dari riwayat
setInterval(() => { if(auth.currentUser) render(); }, 60 * 1000);
</script>
</body>
</html>
